name: Deploy to Firebase Hosting on PR

on:
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/console/shell/package-lock.json

      - name: Install console dependencies
        working-directory: frontend/console/shell
        run: npm ci

      - name: Check brand image policy generated files
        working-directory: frontend/console/shell
        run: npm run check:brand-image-policy

      - name: Build console
        working-directory: frontend/console/shell
        run: npm run build

      - name: Deploy Firebase Hosting preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NARRATIVES_DEVELOPMENT_26C2D }}
          projectId: narratives-development-26c2d
          entryPoint: frontend/console